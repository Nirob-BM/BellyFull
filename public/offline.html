<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d3b3a" />
    <title>Offline — Belly Full</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        background: #0d3b3a;
        color: #f5efe4;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 28rem;
        width: 100%;
      }
      .badge {
        width: 72px;
        height: 72px;
        border-radius: 9999px;
        background: rgba(230, 181, 74, 0.15);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        margin: 0 0 0.5rem;
        color: #f5efe4;
      }
      p {
        color: rgba(245, 239, 228, 0.75);
        line-height: 1.6;
        margin: 0 0 1.5rem;
        font-size: 0.975rem;
      }
      button {
        background: #e6b54a;
        color: #0d3b3a;
        border: 0;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        min-height: 44px;
        transition: opacity 0.2s ease;
      }
      button:hover { opacity: 0.9; }
      .brand {
        margin-top: 2rem;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(245, 239, 228, 0.4);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e6b54a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0119 12.55" />
          <path d="M5 12.55a10.94 10.94 0 015.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0122.58 9" />
          <path d="M1.42 9a15.91 15.91 0 014.7-2.88" />
          <path d="M8.53 16.11a6 6 0 016.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Please check your internet connection and try again. Belly Full needs a connection to show you the freshest menu and prices.</p>
      <button onclick="window.location.reload()">Try Again</button>
      <div class="brand">Belly Full</div>
    </div>
  </body>
</html>
